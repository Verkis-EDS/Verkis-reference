# Optional project documentation scaffold; no automatic portal deployment.
site_name: <project-slug>
docs_dir: docs
nav:
  - Home: index.md
  - Setup: setup.md
  - Architecture: architecture.md
  - Operations: operations.md
  - Troubleshooting: troubleshooting.md
  - Decisions: decisions.md
  - Changelog: changelog.md
markdown_extensions:
  - tables
  - toc:
      permalink: true
